            {name: "Skull Jellyfish", price: 665, location: "Water Cave", specificLocation: "floor 50 (south end)", season: "Spring, Fall", weather: "Any weather", time: "7pm-5am", exp: 120, spriteId: 38},
            {name: "Giant Arowana", price: 650, location: "Goddess Pond", specificLocation: "shrine waters (right side)", season: "Spring, Summer, Fall", weather: "Rain, Thunderstorm, Hurricane", time: "5am-7pm", exp: 130, spriteId: 39},
            {name: "Barracuda", price: 680, location: "Toucan Island", specificLocation: "south shore", season: "Any season", weather: "Sunny, Cloudy, Snow, Snowstorm", time: "8am-7pm", exp: 130, spriteId: 40},
            {name: "Tarpon", price: 800, location: "Toucan Island", specificLocation: "northeast shore", season: "Spring, Winter", weather: "Sunny, Cloudy, Snow, Snowstorm", time: "7pm-3pm", exp: 130, spriteId: 41},
            {name: "Dorado", price: 700, location: "Fugue Forest", specificLocation: "footbridge, left", season: "Spring, Summer", weather: "Rain, Thunderstorm, Hurricane", time: "Any time", exp: 130, spriteId: 42},
            {name: "Nautilus", price: 830, location: "Water Cave", specificLocation: "floor 0", season: "Spring, Summer, Fall", weather: "Sunny, Cloudy, Thunderstorm, Hurricane", time: "3pm-5am", exp: 130, spriteId: 43},
            {name: "King Salmon", price: 760, location: "Flute Fields", specificLocation: "bridge, south", season: "Summer, Fall", weather: "Sunny, Cloudy, Hurricane", time: "7pm-9am", exp: 110, spriteId: 44},
            {name: "Giant Halibut", price: 850, location: "Harmonica Town", specificLocation: "lighthouse", season: "Spring, Winter", weather: "Sunny", time: "Any time", exp: 110, spriteId: 45},
            {name: "Brown Trout", price: 79, location: "Multiple", specificLocation: "Clarinet District (pond), Garmon Mine (stream), Flute Fields (bridge north/south, river west)", season: "Any season", weather: "Any weather", time: "5am-7pm", exp: 19, spriteId: 46},
            {name: "Herring", price: 76, location: "Multiple", specificLocation: "Clarinet District (shores), Harmonica Town (seawall, lighthouse, beach), Toucan Island (northeast shore), Water Cave (floor 0)", season: "Spring, Winter", weather: "Any weather", time: "7pm-5am", exp: 12, spriteId: 47}
        ];

        let currentSortOrder = 'asc';
        let currentSearchTerm = '';
        let filteredFishData = fishData;

        function categorizeSeasons(season) {
            if (season === "Any season") return "Any Season";
            
            // Handle multiple seasons properly
            const seasons = [];
            if (season.includes("Spring")) seasons.push("Spring");
            if (season.includes("Summer")) seasons.push("Summer");
            if (season.includes("Fall")) seasons.push("Fall");
            if (season.includes("Winter")) seasons.push("Winter");
            
            // Return all applicable seasons
            if (seasons.length === 1) return seasons[0];
            if (seasons.length > 1) return seasons; // Return array for multiple seasons
            
            return "Multiple Seasons";
        }

        function parseLocations(fish) {
            if (fish.location !== "Multiple") {
                return [fish.location];
            }
            
            // Parse specific locations to extract main location names
            const locations = [];
            const specificLoc = fish.specificLocation.toLowerCase();
            
            if (specificLoc.includes('clarinet district')) locations.push('Clarinet District');
            if (specificLoc.includes('harmonica town')) locations.push('Harmonica Town');
            if (specificLoc.includes('flute fields')) locations.push('Flute Fields');
            if (specificLoc.includes('garmon mine')) locations.push('Garmon Mine');
            if (specificLoc.includes('toucan island')) locations.push('Toucan Island');
            if (specificLoc.includes('goddess pond')) locations.push('Goddess Pond');
            if (specificLoc.includes('fugue forest')) locations.push('Fugue Forest');
            if (specificLoc.includes('water cave')) locations.push('Water Cave');
            
            if (locations.length === 0) {
                locations.push('Various Locations');
            }
            
            return locations;
        }

        function getWeatherSymbol(weather) {
            if (weather === "Any weather") return "*";
            if (weather.includes("Sunny") || weather.includes("Clear")) return "☀️";
            if (weather.includes("Cloudy")) return "☁️";
            if (weather.includes("Rain") || weather.includes("Thunderstorm") || weather.includes("Hurricane")) return "🌧️";
            if (weather.includes("Snow") || weather.includes("Snowstorm")) return "❄️";
            return "*";
        }

        function cleanTime(time) {
            if (time === "All day" || time === "Any time") return time;
            
            return time
                .replace(/(\d+):00\s*/g, '$1') // Remove ":00" from times
                .replace(/\s+am/g, 'am')       // Remove spaces before am
                .replace(/\s+pm/g, 'pm')       // Remove spaces before pm
                .replace(/\s+to\s+/g, '-')     // Replace " to " with "-"
                .replace(/,\s+/g, ',');        // Remove spaces after commas
        }



        function getFishImageUrl(spriteId) {
            return `https://23409588f3e6b520e202-1fd01abd62a9d4f09fad4d757fc45540.ssl.cf2.rackcdn.com/fish${spriteId.toString().padStart(2, '0')}.jpg`;
        }

        function sortByPrice(order) {
            currentSortOrder = order;
            
            // Update button states
            document.querySelectorAll('.sort-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            renderTable();
        }

        function renderTable() {
            const tableContainer = document.getElementById('fishTable');
            
            // Group fish by season and location
            const grouped = {};
            
            filteredFishData.forEach(fish => {
                const seasons = categorizeSeasons(fish.season);
                const locations = parseLocations(fish);
                
                // Handle both single season and multiple seasons
                const seasonArray = Array.isArray(seasons) ? seasons : [seasons];
                
                seasonArray.forEach(season => {
                    locations.forEach(location => {
                        if (!grouped[season]) grouped[season] = {};
                        if (!grouped[season][location]) grouped[season][location] = [];
                        
                        grouped[season][location].push(fish);
                    });
                });
            });
            
            // Sort fish within each group by price
            Object.keys(grouped).forEach(season => {
                Object.keys(grouped[season]).forEach(location => {
                    grouped[season][location].sort((a, b) => {
                        return currentSortOrder === 'asc' ? a.price - b.price : b.price - a.price;
                    });
                });
            });
            
            // Render the table
            let html = '';
            
            // Order seasons logically
            const seasonOrder = ['Spring', 'Summer', 'Fall', 'Winter', 'Any Season', 'Multiple Seasons'];
            
            let isFirstSeason = true;
            seasonOrder.forEach(season => {
                if (grouped[season]) {
                    // Add separator before each season except the first
                    if (!isFirstSeason) {
                        html += `<div class="season-separator"></div>`;
                    }
                    isFirstSeason = false;
                    
                    const seasonClass = season.toLowerCase().replace(/\s+/g, '-');
                    html += `<div class="season-section" id="season-${seasonClass}">
                        <div class="season-header ${seasonClass}">${season}</div>`;
                    
                    Object.keys(grouped[season]).sort().forEach(location => {
                        html += `<div class="location-group">
                            <div class="location-header">${location}</div>`;
                        
                        // Fish Cards
                        grouped[season][location].forEach(fish => {
                            html += `<div class="fish-card">
                                <div class="fish-card-header">
                                    <img src="${getFishImageUrl(fish.spriteId)}" alt="${fish.name}" class="fish-card-portrait" onerror="this.style.display='none'">
                                    <div class="fish-card-name">${fish.name}</div>
                                    <div class="fish-card-price">${fish.price} G</div>
                                </div>
                                <div class="fish-card-details">
                                    <div class="fish-card-detail">
                                        <strong>Time:</strong> ${cleanTime(fish.time)}
                                    </div>
                                    <div class="fish-card-detail">
                                        <strong>Weather:</strong> ${getWeatherSymbol(fish.weather)}
                                    </div>
                                    <div class="fish-card-detail">
                                        <strong>EXP:</strong> ${fish.exp}
                                    </div>
                                </div>
                                <div class="fish-card-location">
                                    <strong>Location:</strong> ${fish.specificLocation}
                                </div>
                            </div>`;
                        });
                        
                        html += '</div>';
                    });
                    
                    html += '</div>';
                }
            });
            
            tableContainer.innerHTML = html;
        }

        function scrollToSeason(season) {
            const seasonId = `season-${season.replace(/\s+/g, '-').toLowerCase()}`;
            const element = document.getElementById(seasonId);
            if (element) {
                element.scrollIntoView({ 
                    behavior: 'smooth', 
                    block: 'start' 
                });
            }
        }

        function searchFish(searchTerm) {
            currentSearchTerm = searchTerm.toLowerCase().trim();
            
            if (currentSearchTerm === '') {
                filteredFishData = fishData;
                document.getElementById('searchResults').innerHTML = '';
            } else {
                filteredFishData = fishData.filter(fish => 
                    fish.name.toLowerCase().includes(currentSearchTerm) ||
                    fish.specificLocation.toLowerCase().includes(currentSearchTerm) ||
                    fish.location.toLowerCase().includes(currentSearchTerm)
                );
                
                const resultCount = filteredFishData.length;
                const resultsText = resultCount === 1 ? '1 fish found' : `${resultCount} fish found`;
                document.getElementById('searchResults').innerHTML = resultsText;
            }
            
            renderTable();
        }

        function clearSearch() {
            document.getElementById('fishSearch').value = '';
            searchFish('');
            document.querySelector('.clear-search').style.display = 'none';
        }

        // Search event listeners
        document.addEventListener('DOMContentLoaded', function() {
            const searchInput = document.getElementById('fishSearch');
            const clearButton = document.getElementById('clearSearch');
            
            searchInput.addEventListener('input', function(e) {
                const value = e.target.value;
                searchFish(value);
                
                // Show/hide clear button
                clearButton.style.display = value ? 'block' : 'none';
            });
            
            clearButton.addEventListener('click', clearSearch);
            
            // Enter key to search
            searchInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    searchFish(e.target.value);
                }
            });
        });

        // Initial render
        renderTable();
    </script>
</body>
</html>
